global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: kong
    scrape_interval: 10s
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*/kong.yml
        refresh_interval: 30s

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*/apis.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          environment: production
          service: linux

  - job_name: postgres
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*/postgres.yml
        refresh_interval: 30s
